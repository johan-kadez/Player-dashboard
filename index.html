<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player List</title><style>
body{margin:0;background:#080b10;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}h1{margin:0}.sub{color:#8d98a8;margin:6px 0 22px}input{width:100%;padding:13px;box-sizing:border-box;background:#10151d;border:1px solid #293444;border-radius:10px;color:white;margin-bottom:15px}.table{overflow:auto;background:#10151d;border:1px solid #202938;border-radius:14px}table{width:100%;min-width:650px;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #202938}th{font-size:12px;color:#8d98a8;text-transform:uppercase}.badge{background:#182231;padding:6px 9px;border-radius:7px}.status{font-size:12px;color:#8d98a8;margin-bottom:12px}.empty{text-align:center;padding:30px;color:#8d98a8}
</style></head><body><div class="wrap"><h1>PLAYER LIST</h1><div class="sub">Daftar player • Read Only</div><div class="status" id="status">Menghubungkan database...</div><input id="search" placeholder="🔎 Cari player..."><div class="table"><table><thead><tr><th>No.</th><th>Nama Player</th><th>ID Player</th><th>TikTok</th><th>WhatsApp</th></tr></thead><tbody id="body"></tbody></table></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getFirestore,collection,onSnapshot}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import{firebaseConfig}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),db=getFirestore(app);let data=[];
  const status=document.getElementById("status");
const body=document.getElementById("body");
const search=document.getElementById("search");
onSnapshot(collection(db,"players"),snap=>{data=snap.docs.map(d=>({id:d.id,...d.data()}));data.sort((a,b)=>(a.name||"").localeCompare(b.name||""));status.textContent="● Database tersambung • "+data.length+" player";render()},e=>status.textContent="Database error: "+e.message);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){let q=search.value.toLowerCase(),a=data.filter(p=>Object.values(p).join(" ").toLowerCase().includes(q));body.innerHTML=a.length?a.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td><span class="badge">${esc(p.playerId)}</span></td><td>${esc(p.tiktok||"-")}</td><td>${esc(p.wa||"-")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Belum ada data.</td></tr>`}
</script></body></html>
search.oninput=render;
