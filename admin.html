<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><style>
body{margin:0;background:#080b10;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.login{max-width:390px;margin:10vh auto;background:#10151d;border:1px solid #293444;border-radius:16px;padding:24px}.dashboard{display:none}h1{margin:0}.sub,.status{color:#8d98a8;margin:6px 0 20px}.form{display:grid;gap:12px}input{width:100%;padding:12px;box-sizing:border-box;background:#0b1017;border:1px solid #293444;border-radius:10px;color:white}button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}.primary{background:white;color:#080b10}.danger{background:#3a2027;color:#ffbdc6}.muted{background:#293444;color:white}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1;margin:0}.table{overflow:auto;background:#10151d;border:1px solid #202938;border-radius:14px}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #202938}th{font-size:12px;color:#8d98a8}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.box{width:min(450px,100%);background:#10151d;border:1px solid #293444;border-radius:16px;padding:22px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.error{color:#ff8a98;margin-top:10px;font-size:13px}
</style></head><body>
<div class="login" id="login"><h1>ADMIN PANEL</h1><div class="sub">Login dengan akun Firebase Authentication</div><div class="form"><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button class="primary" id="loginBtn">LOGIN</button></div><div class="error" id="error"></div></div>
<div class="wrap dashboard" id="dash"><header><div><h1>ADMIN PANEL</h1><div class="sub">Kelola database peserta</div><div class="status" id="status"></div></div><button class="muted" id="logout">Logout</button></header><div class="toolbar"><input id="search" placeholder="🔎 Cari player..."><button class="primary" id="add">+ Tambah</button></div><div class="table"><table><thead><tr><th>No.</th><th>Nama</th><th>ID</th><th>TikTok</th><th>WhatsApp</th><th>Aksi</th></tr></thead><tbody id="body"></tbody></table></div></div>
<div class="modal" id="modal"><div class="box"><h2 id="title">Tambah Peserta</h2><div class="form"><input id="name" placeholder="Nama Player"><input id="playerId" placeholder="ID Player"><input id="tiktok" placeholder="Nama TikTok"><input id="wa" placeholder="Nomor WhatsApp"></div><div class="actions"><button class="muted" id="cancel">Batal</button><button class="primary" id="save">Simpan</button></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import{firebaseConfig}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let data=[],editId=null;
const loginBtn=document.getElementById("loginBtn");
const email=document.getElementById("email");
const password=document.getElementById("password");
const error=document.getElementById("error");
const logout=document.getElementById("logout");
const add=document.getElementById("add");
const cancel=document.getElementById("cancel");
const save=document.getElementById("save");
const search=document.getElementById("search");
const body=document.getElementById("body");
const modal=document.getElementById("modal");
const title=document.getElementById("title");
const name=document.getElementById("name");
const playerId=document.getElementById("playerId");
const tiktok=document.getElementById("tiktok");
const wa=document.getElementById("wa");
const login=document.getElementById("login");
const dash=document.getElementById("dash");
const status=document.getElementById("status");
  loginBtn.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value);error.textContent=""}catch(e){error.textContent="Login gagal: "+e.message}};
logout.onclick=()=>signOut(auth);add.onclick=()=>openModal();cancel.onclick=closeModal;search.oninput=render;
onAuthStateChanged(auth,user=>{if(user){login.style.display="none";dash.style.display="block";status.textContent="Login: "+user.email;listen()}else{login.style.display="block";dash.style.display="none"}});
function listen(){onSnapshot(collection(db,"players"),s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));data.sort((a,b)=>(a.name||"").localeCompare(b.name||""));render()})}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){let q=search.value.toLowerCase(),a=data.map((p,i)=>({p,i})).filter(x=>Object.values(x.p).join(" ").toLowerCase().includes(q));body.innerHTML=a.length?a.map((x,n)=>`<tr><td>${n+1}</td><td>${esc(x.p.name)}</td><td>${esc(x.p.playerId)}</td><td>${esc(x.p.tiktok||"-")}</td><td>${esc(x.p.wa||"-")}</td><td><button class="muted" onclick="editPlayer('${x.p.id}')">Edit</button> <button class="danger" onclick="removePlayer('${x.p.id}')">Hapus</button></td></tr>`).join(""):`<tr><td colspan="6">Belum ada data.</td></tr>`}
window.editPlayer=id=>{let p=data.find(x=>x.id===id);if(!p)return;editId=id;title.textContent="Edit Player";name.value=p.name||"";playerId.value=p.playerId||"";tiktok.value=p.tiktok||"";wa.value=p.wa||"";modal.style.display="flex"};
window.removePlayer=async id=>{if(confirm("Hapus player ini?"))await deleteDoc(doc(db,"players",id))};
function openModal(){editId=null;title.textContent="Tambah Player";name.value="";playerId.value="";tiktok.value="";wa.value="";modal.style.display="flex"}function closeModal(){modal.style.display="none"}
save.onclick=async()=>{let p={name:name.value.trim(),playerId:playerId.value.trim(),tiktok:tiktok.value.trim(),wa:wa.value.trim()};if(!p.name||!p.playerId)return alert("Nama dan ID Player wajib diisi.");if(editId)await updateDoc(doc(db,"players",editId),p);else await addDoc(collection(db,"players"),p);closeModal()};
</script></body></html>
